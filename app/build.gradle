plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.myapplication3'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.example.myapplication3"
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    //sirve para animar json
    implementation 'com.airbnb.android:lottie:3.0.1'
    //sirve para analisis de datos de firebase
    implementation 'com.google.firebase:firebase-analytics:21.3.0'
    //libreria de autenticacion de firebase
    implementation'com.google.firebase:firebase-auth:22.1.2'
    //libreria de la base de datos de firebase
    implementation'com.google.firebase:firebase-database:20.2.2'
    implementation'com.firebaseui:firebase-ui-database:8.0.0'

    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

}